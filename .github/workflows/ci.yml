name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The graph tests (lib/graph/*.test.ts) run against a real FalkorDB.
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        env:
          BROWSER: "0"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      # pnpm at the version package.json pins (packageManager).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Also generates the Prisma client (postinstall).
      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
        env:
          FALKORDB_URL: redis://localhost:6379

      # No database needed: nothing connects until a request runs.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # The self-hosted path, as the README gives it: the images build, migrations
  # apply, and the app comes up answering its healthcheck.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -hex 32)|" .env

      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: curl -fsS http://localhost:3000/api/health

      - if: failure()
        run: docker compose logs --no-color

      - run: docker compose --profile ingest build ingest

  # The ingest service's own tests, against the real embedding weights.
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: service
    env:
      INGEST_SECRET: dev-secret
      MODEL_DIR: models/arctic-embed-s
    steps:
      - uses: actions/checkout@v7

      - run: pipx install uv
      - run: uv sync --frozen
      - run: uv run python scripts/fetch_model.py
      - run: uv run pytest
