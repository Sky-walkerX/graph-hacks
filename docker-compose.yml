# LockIn Relay (Graph Hacks), self-hosted.
#
#   cp .env.example .env    # then set AUTH_SECRET (and INGEST_SECRET for the ingest profile)
#   docker compose up -d    # Postgres + FalkorDB + LockIn on http://localhost:3000
#
# The images are built from this checkout (nothing is pulled for them);
# `up --build` rebuilds after a change.
#
# Add PDF/link text extraction and server-side embeddings:
#   docker compose --profile ingest up -d
#
# Add HTTPS on a machine the internet can reach (see README):
#   docker compose --profile https up -d
#
# Data lives in three volumes: `db` (Postgres), `graph` (FalkorDB) and
# `uploads` (note images, PDFs).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lockin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lockin}
      POSTGRES_DB: lockin
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockin -d lockin"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The graph: memory revisions, dependencies, handoffs and context receipts.
  # Port 6379 is published to the machine itself only, for `pnpm dev`; the app
  # container reaches it as falkordb:6379. FalkorDB Browser (a graph viewer)
  # listens on FALKORDB_BROWSER_PORT, also on the machine itself only.
  falkordb:
    image: falkordb/falkordb:v4.22.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3001}:3000"
    environment:
      BROWSER: ${FALKORDB_BROWSER:-1}
      # Append-only file as well as snapshots, so a restart keeps every write.
      REDIS_ARGS: --appendonly yes
    volumes:
      - graph:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs `prisma migrate deploy` once, then exits; the app waits for it.
  migrate:
    image: graph-hacks-migrate:local
    build: { context: ., target: migrate }
    environment: &db-env
      DATABASE_URL: postgresql://lockin:${POSTGRES_PASSWORD:-lockin}@db:5432/lockin
      DIRECT_URL: postgresql://lockin:${POSTGRES_PASSWORD:-lockin}@db:5432/lockin
    depends_on:
      db: { condition: service_healthy }

  app:
    image: graph-hacks:local
    build: { context: ., target: app, args: { PUBLIC_URL: "${PUBLIC_URL:-}" } }
    restart: unless-stopped
    # Published to the machine itself only, so a proxy in front (the https
    # profile, or your own) can't be gone around. LOCKIN_BIND=0.0.0.0 opens it
    # to the network; set TRUSTED_PROXY_HOPS=0 with it.
    ports:
      - "${LOCKIN_BIND:-127.0.0.1}:${LOCKIN_PORT:-3000}:3000"
    environment:
      <<: *db-env
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 32)}
      NEXTAUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/uploads
      # Optional: Google sign-in appears only when both are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # "closed" stops new accounts once the first one exists.
      SIGNUP: ${SIGNUP:-open}
      # Optional: with SMTP_HOST set, sign-up confirms the address by email
      # and a forgotten password can be reset from a link.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional: who runs this instance. With OPERATOR_EMAIL set, /privacy
      # and /terms appear.
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_HOSTING: ${OPERATOR_HOSTING:-}
      # Megabytes of files each account may store; 0 for no ceiling.
      STORAGE_QUOTA_MB: ${STORAGE_QUOTA_MB:-1024}
      # "off" drops the limits on sign-in tries, sign-ups and the like.
      RATE_LIMITS: ${RATE_LIMITS:-on}
      # How many proxies stand between visitors and LockIn; 0 when visitors
      # reach port 3000 directly (see README).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Used only when the ingest profile is running.
      INGEST_URL: ${INGEST_URL:-}
      INGEST_SECRET: ${INGEST_SECRET:-}
      APP_INTERNAL_URL: http://app:3000
      FALKORDB_URL: redis://falkordb:6379
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      falkordb: { condition: service_healthy }
    # The image has no curl; node is already there.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Time for requests in flight, and indexing queued behind a reply, to finish.
    stop_grace_period: 30s

  # Optional: `docker compose --profile ingest up`. Then set
  # INGEST_URL=http://ingest:8080 and INGEST_SECRET in .env.
  ingest:
    profiles: [ingest]
    image: graph-hacks-ingest:local
    build: ./service
    restart: unless-stopped
    environment:
      # Required for this profile; the service refuses to start without it.
      # (Not a compose ${…:?} check: compose would demand it even when the
      # profile isn't used.)
      INGEST_SECRET: ${INGEST_SECRET:-}
      # Lets the parser fetch PDFs the app stores on its own disk.
      INGEST_ALLOWED_HOSTS: app
      # How many documents are read at once. Each can take a core and a few
      # hundred MB for a minute; raise it on a machine with room.
      PARSE_CONCURRENCY: ${PARSE_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional: `docker compose --profile https up`, with PUBLIC_URL set to the
  # https:// address in .env.
  caddy:
    profiles: [https]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and its key. Losing them only means asking for new ones.
      - caddy:/data
    depends_on:
      - app

volumes:
  db:
  graph:
  uploads:
  caddy:
